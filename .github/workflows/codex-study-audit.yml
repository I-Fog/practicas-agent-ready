name: Codex Study Audit

on:
  pull_request:
  push:

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install codex-study-oss-kit
        run: python -m pip install "git+https://github.com/I-Fog/codex-study-oss-kit.git@v0.1.2"
      - name: Audit practices
        run: |
          mkdir -p reports
          codex-study audit practicas/python-basics --format markdown --output reports/python-basics.md
          codex-study audit practicas/cpp-basics --format markdown --output reports/cpp-basics.md
      - name: Run practice checks
        run: |
          cd practicas/python-basics
          python -m unittest discover -s tests
          cd ../..
          mkdir -p build
          g++ -std=c++17 -I practicas/cpp-basics/src practicas/cpp-basics/tests/test_sumar_pares.cpp -o build/test_sumar_pares
          ./build/test_sumar_pares
      - name: Comment audit summary on pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const path = require("path");

            const marker = "<!-- codex-study-audit -->";
            const reportDir = "reports";
            const reports = fs
              .readdirSync(reportDir)
              .filter((file) => file.endsWith(".md"))
              .sort()
              .map((file) => {
                const name = file.replace(/\.md$/, "");
                const body = fs.readFileSync(path.join(reportDir, file), "utf8").trim();
                return `### ${name}\n\n${body}`;
              })
              .join("\n\n");

            const body = `${marker}\n## Codex Study Audit\n\n${reports}\n\n_Updated by Codex Study Audit workflow._`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.data.find(
              (comment) => comment.user.type === "Bot" && comment.body.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: codex-study-audit
          path: reports/*.md
